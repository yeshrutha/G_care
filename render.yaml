databases:
  - name: g-care-db
    plan: free

services:
  - type: web
    name: g-care
    env: node
    plan: starter
    disk:
      name: gcare-files
      mountPath: /var/data
      sizeGB: 1
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: g-care-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true      - key: DATA_DIR
        value: /var/data/gcare
      - key: DEMO_AUTH_ENABLED
        value: false
